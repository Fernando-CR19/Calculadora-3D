<header class="bg-brand text-on-brand p-2 flex justify-between items-center">
  <button
    #menuButton
    app-icon-button
    icon="matMenuOutline"
    aria-label="Abrir aba lateral"
    [attr.aria-expanded]="isMenuOpen()"
    (click)="toggleMenuState()"
  ></button>

  <div class="flex gap-2">
    <button app-icon-button icon="matLightModeOutline" aria-label="Mudar tema do site"></button>

    <button
      app-icon-button
      icon="matAccountCircleOutline"
      aria-label="Abrir informações do usuário"
      [cdkMenuTriggerFor]="account"
    ></button>

    <ng-template #account>
      <div cdkMenu class="border border-on-brand rounded-lg bg-brand text-on-brand overflow-hidden">
        <button
          type="button"
          class="p-2 cursor-pointer hover:bg-on-brand hover:text-brand focus-visible:bg-on-brand focus-visible:text-brand focus-visible:outline-none"
          cdkMenuItem
          (cdkMenuItemTriggered)="logout()"
        >
          Sair da conta
        </button>
      </div>
    </ng-template>
  </div>
</header>

<div
  class="fixed inset-0 bg-overlay/50 z-40 transition-opacity duration-300 ease-in-out"
  [class.opacity-100]="isMenuOpen()"
  [class.opacity-0]="!isMenuOpen()"
  [class.pointer-events-none]="!isMenuOpen()"
  aria-hidden="true"
  (click)="closeMenu()"
></div>

<nav
  class="fixed top-0 left-0 h-dvh w-64 bg-brand text-on-brand p-6 transition-transform duration-300 ease-in-out z-50"
  [class.-translate-x-full]="!isMenuOpen()"
  [class.translate-x-0]="isMenuOpen()"
  [inert]="!isMenuOpen()"
>
  <div class="flex justify-end mb-4">
    <button
      app-icon-button
      icon="matCloseOutline"
      aria-label="Fechar aba lateral"
      (click)="closeMenuAndRestoreFocus()"
    ></button>
  </div>

  <ul class="space-y-4">
    <li>
      <a
        routerLink="/app"
        routerLinkActive="bg-on-brand text-brand font-medium"
        [routerLinkActiveOptions]="{ exact: true }"
        class="block hover:bg-on-brand hover:text-brand p-2 rounded-xs focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-on-brand focus-visible:ring-offset-2 focus-visible:ring-offset-brand transition-colors"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        Orçamento
      </a>
    </li>
  </ul>
</nav>
<main>
  <router-outlet></router-outlet>
</main>
